<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1e1f22">
  <meta name="description" content="insaycord — Real-time community communication, text channels, roles, and voice rooms.">
  <title>insaycord — Community Communication</title>
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <div class="cord-layout">
    <!-- PANEL 1: SERVERS RAIL -->
    <aside class="servers-rail">
      <div class="server-pill active" id="pillHome" title="Direct Messages">💬</div>
      <div class="server-divider"></div>
      <div id="dynamicServersList" style="display:flex;flex-direction:column;gap:8px;align-items:center"></div>
      <div class="server-pill" id="addServerBtn" title="Add a Server" style="color:var(--accent-green);font-size:24px">＋</div>
    </aside>

    <!-- PANEL 2: CHANNELS & USER PANEL -->
    <aside class="channels-panel">
      <div class="server-header">
        <span id="currentServerName">The Workshop</span>
        <button id="serverMenuBtn" style="font-size:16px;color:var(--text-muted)">▾</button>
      </div>

      <div class="channels-list" id="channelsList">
        <div class="channel-category-label">Text Channels</div>
        <div id="textChannelsContainer"></div>
        <div class="channel-category-label" style="margin-top:12px">Voice Channels</div>
        <div id="voiceChannelsContainer"></div>
      </div>

      <!-- Current User Mini Panel -->
      <div class="current-user-bar">
        <div class="user-avatar-wrap">
          <img id="myAvatar" src="" alt="">
          <span class="status-dot status-online" id="myStatusDot"></span>
        </div>
        <div style="flex:1;min-width:0">
          <b id="myDisplayName" style="font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis">Guest</b>
          <small id="myUsername" style="color:var(--text-muted);font-size:11px">Offline</small>
        </div>
        <div style="display:flex;gap:4px">
          <button id="toggleMicBtn" title="Mute/Unmute Mic" style="padding:4px;font-size:15px">🎤</button>
          <button id="toggleDeafenBtn" title="Deafen/Undeafen" style="padding:4px;font-size:15px">🎧</button>
          <button id="authTriggerBtn" class="btn-outline" style="padding:2px 6px;font-size:11px;border-radius:4px">Auth</button>
        </div>
      </div>
    </aside>

    <!-- PANEL 3: CHAT & VOICE STAGE -->
    <main class="chat-stage">
      <header class="chat-topbar">
        <div class="channel-title-wrap">
          <span class="channel-prefix" id="activeChannelPrefix">#</span>
          <span id="activeChannelName">general</span>
          <span class="channel-topic" id="activeChannelTopic">General community discussion</span>
        </div>
        <div style="display:flex;align-items:center;gap:12px">
          <button id="addChannelBtn" title="Create Channel" style="font-size:14px;color:var(--text-muted)">＋ Channel</button>
          <input type="text" id="messageSearch" placeholder="Search" style="background:#1e1f22;border:0;outline:0;border-radius:4px;padding:4px 8px;font-size:12px;width:120px;color:white">
        </div>
      </header>

      <!-- TEXT CHANNEL VIEW -->
      <div class="messages-stream" id="messagesStream"></div>

      <!-- TEXT INPUT BAR -->
      <div class="chat-input-area" id="chatInputArea">
        <div class="typing-indicator-bar" id="typingIndicator"></div>
        <form class="chat-input-box" id="messageForm">
          <input type="text" class="chat-input-field" id="messageInput" placeholder="Message #general..." required>
        </form>
      </div>

      <!-- VOICE ROOM OVERLAY (Active when joined a voice room) -->
      <div class="voice-stage-overlay" id="voiceStageOverlay" style="display:none">
        <div style="text-align:center">
          <h2 style="font:800 20px 'Plus Jakarta Sans'" id="voiceRoomTitle">🔊 Lounge Voice</h2>
          <small style="color:var(--accent-green);font-weight:700">RTC Voice Connected • RTC Peer Signaling Active</small>
        </div>
        <div class="voice-grid" id="voiceParticipantsGrid"></div>
        <div class="voice-bottom-controls">
          <button class="voice-ctrl-btn" id="voiceMuteToggle">🎤</button>
          <button class="voice-ctrl-btn" id="voiceDeafenToggle">🎧</button>
          <button class="voice-disconnect-btn" id="voiceDisconnectBtn">📞 Disconnect</button>
        </div>
      </div>
    </main>

    <!-- PANEL 4: SERVER MEMBERS -->
    <aside class="members-panel" id="membersPanel">
      <div class="channel-category-label">Online Members</div>
      <div id="membersContainer"></div>
    </aside>
  </div>

  <!-- MODALS -->

  <!-- 1. Create Server Dialog -->
  <dialog id="createServerDialog">
    <form id="createServerForm">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <h3 style="font:800 20px 'Plus Jakarta Sans'">Create Your Server</h3>
        <button type="button" class="close-dialog" style="font-size:22px;color:var(--text-muted)">×</button>
      </div>
      <div style="margin-bottom:14px">
        <label style="font-size:12px;color:var(--text-muted);display:block;margin-bottom:6px">SERVER NAME</label>
        <input type="text" id="serverNameInput" class="form-input" required placeholder="The Indie Makers">
      </div>
      <div style="margin-bottom:18px">
        <label style="font-size:12px;color:var(--text-muted);display:block;margin-bottom:6px">TOPIC / DESCRIPTION</label>
        <textarea id="serverDescInput" rows="3" class="form-input" placeholder="What is this community about?"></textarea>
      </div>
      <div style="display:flex;justify-content:flex-end;gap:10px">
        <button type="button" class="close-dialog" style="padding:8px 14px">Cancel</button>
        <button type="submit" style="background:var(--accent);color:white;padding:8px 18px;border-radius:4px;font-weight:700">Create</button>
      </div>
    </form>
  </dialog>

  <!-- 2. Create Channel Dialog -->
  <dialog id="createChannelDialog">
    <form id="createChannelForm">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <h3 style="font:800 20px 'Plus Jakarta Sans'">Create Channel</h3>
        <button type="button" class="close-dialog" style="font-size:22px;color:var(--text-muted)">×</button>
      </div>
      <div style="margin-bottom:14px">
        <label style="font-size:12px;color:var(--text-muted);display:block;margin-bottom:6px">CHANNEL TYPE</label>
        <select id="channelTypeInput" class="form-input">
          <option value="text"># Text</option>
          <option value="voice">🔊 Voice</option>
        </select>
      </div>
      <div style="margin-bottom:14px">
        <label style="font-size:12px;color:var(--text-muted);display:block;margin-bottom:6px">CHANNEL NAME</label>
        <input type="text" id="channelNameInput" class="form-input" required placeholder="launches">
      </div>
      <div style="display:flex;justify-content:flex-end;gap:10px">
        <button type="button" class="close-dialog" style="padding:8px 14px">Cancel</button>
        <button type="submit" style="background:var(--accent);color:white;padding:8px 18px;border-radius:4px;font-weight:700">Create Channel</button>
      </div>
    </form>
  </dialog>

  <!-- 3. Auth Dialog -->
  <dialog id="authDialog">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h3 id="authTitle" style="font:800 20px 'Plus Jakarta Sans'">Welcome back!</h3>
      <button type="button" class="close-dialog" style="font-size:22px;color:var(--text-muted)">×</button>
    </div>
    <div style="display:flex;gap:10px;margin-bottom:16px">
      <button type="button" id="tabLogin" style="flex:1;background:#2b2d31;padding:8px;border-radius:4px;font-weight:700">Login</button>
      <button type="button" id="tabRegister" style="flex:1;background:transparent;padding:8px;border-radius:4px;font-weight:700">Register</button>
    </div>
    <form id="authForm">
      <div style="margin-bottom:12px">
        <label style="font-size:12px;color:var(--text-muted);display:block;margin-bottom:4px">USERNAME</label>
        <input type="text" id="authUsername" class="form-input" required placeholder="alex_architect">
      </div>
      <div style="margin-bottom:12px;display:none" id="groupEmail">
        <label style="font-size:12px;color:var(--text-muted);display:block;margin-bottom:4px">EMAIL</label>
        <input type="email" id="authEmail" class="form-input" placeholder="alex@example.com">
      </div>
      <div style="margin-bottom:12px;display:none" id="groupDisplayName">
        <label style="font-size:12px;color:var(--text-muted);display:block;margin-bottom:4px">DISPLAY NAME</label>
        <input type="text" id="authDisplayName" class="form-input" placeholder="Alex Rivers">
      </div>
      <div style="margin-bottom:16px">
        <label style="font-size:12px;color:var(--text-muted);display:block;margin-bottom:4px">PASSWORD</label>
        <input type="password" id="authPassword" class="form-input" required placeholder="••••••••">
      </div>
      <div id="authError" style="color:var(--accent-red);font-size:12px;margin-bottom:12px;display:none"></div>
      <button type="submit" style="width:100%;background:var(--accent);color:white;padding:10px;border-radius:4px;font-weight:700">Log In</button>
    </form>
  </dialog>

  <div class="toast-msg" id="toastMsg"></div>

  <script src="src/app.js"></script>
</body>
</html>
